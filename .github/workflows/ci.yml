name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL + texinfo
        run: sudo apt-get update && sudo apt-get install -y sbcl texinfo
      - name: Build the forked manual (.info)
        run: |
          makeinfo --version
          cd docs/emacs-manual/ymacs
          # @include ../emacs/*.texi resolves against the CWD, so build
          # from inside the manual dir or the includes escape the repo.
          makeinfo ymacs.texi -o ymacs.info
          test -f ymacs.info
      - name: Validate License & Manifest
        run: |
          test -f LICENSE
          test -f LICENSE-GFDL-1.3
          test -f NOTICE
          test -f CLA.md
          test -f CLA-signatures.md
          test -f AGENTS.md
          test -f init.org
          test -f src/ymacs.asd
          test -f src/core/rope.lisp
          test -f src/core/buffer.lisp
          test -f src/core/command.lisp
          test -f tests/command-tests.lisp
          test -f tests/org-tests.lisp
          test -f tests/settings-tests.lisp
          test -f src/core/settings.lisp
          test -f src/surfaces/control-server.lisp
          test -f src/elpa/use-package.lisp
          test -f src/elpa/elisp-reader.lisp
          test -f src/elpa/corpus.lisp
          test -f tests/elpa-corpus-tests.lisp
          test -f vendor/elpa-corpus/README.md
          test -f src/elpa/which-key.lisp
          echo "Structural checks passed."
      - name: SBCL Load Check
        run: |
          sbcl --noinform --disable-debugger --no-sysinit --no-userinit \
            --eval '(require :asdf)' \
            --eval '(push #P"./" asdf:*central-registry*)' \
            --eval '(push #P"./src/" asdf:*central-registry*)' \
            --eval '(when (probe-file "vendor/") (dolist (sd (directory "vendor/*/")) (pushnew sd asdf:*central-registry*)))' \
            --eval '(asdf:load-system :ymacs)' \
            --eval '(format t "ymacs ~a loaded~%" (asdf:component-version (asdf:find-system :ymacs)))' \
            --quit
      - name: Command Layer Contract Tests
        run: |
          sbcl --noinform --disable-debugger --no-sysinit --no-userinit \
            --load tests/run-tests.lisp
      - name: Build Binary
        run: |
          sbcl --noinform --disable-debugger --no-sysinit --no-userinit --load build.lisp
          test -x ymacs-bin
          ./ymacs-bin --version
          ./ymacs-bin --help
      - name: Headless Verbs
        run: |
          timeout 5 ./ymacs-bin --help
          echo "headless verbs ok"
